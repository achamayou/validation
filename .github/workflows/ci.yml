name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec cddl-map validate --locked examples/cose-transparency.yml
      - run: bundle exec rake build
